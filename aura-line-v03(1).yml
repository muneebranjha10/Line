      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            "$SDKMANAGER" --install 'platforms;android-35'
          fi
          if [[ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$SDKMANAGER" --install 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Compile AURA LINE APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AURA LINE APK
        uses: actions/upload-artifact@v6
        with:
          name: AURA-LINE-v03-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
