
name: AURA LINE - Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create AURA LINE app
        shell: bash
        run: |
          set -eu
          mkdir -p app/src/main/java/dev/auraline app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AuraLine'
          include ':app'
          EOF

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'dev.auraline'
            compileSdk 35
            defaultConfig {
              applicationId 'dev.auraline'
              minSdk 29
              targetSdk 32
              versionCode 4
              versionName '0.4'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="AURA LINE" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".AuraService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService"/>
                </intent-filter>
                <meta-data android:name="android.accessibilityservice" android:resource="@xml/aura_service"/>
              </service>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/aura_service.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/service_description"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:notificationTimeout="100"
            android:canRequestFilterKeyEvents="true"
            android:accessibilityFlags="flagRequestFilterKeyEvents"/>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="service_description">Shows the AURA LINE volume animation when volume buttons are pressed.</string>
          </resources>
          EOF

          cat > app/src/main/java/dev/auraline/MainActivity.java <<'EOF'
          package dev.auraline;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(1);
              root.setGravity(Gravity.CENTER);
              root.setPadding(36,36,36,36);
              root.setBackgroundColor(Color.rgb(10,16,29));

              TextView info = new TextView(this);
              info.setText("AURA LINE\n\nEnable the AURA LINE accessibility service, then press the volume buttons.\n\nSamsung's stock volume panel remains enabled.");
              info.setTextColor(Color.WHITE);
              info.setTextSize(19);
              root.addView(info);

              Button enable = new Button(this);
              enable.setText("ENABLE AURA LINE");
              enable.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
              root.addView(enable);

              Button preview = new Button(this);
              preview.setText("PREVIEW ANIMATION");
              preview.setOnClickListener(v -> {
                if (AuraService.current != null)
                  AuraService.current.preview();
                else
                  info.setText("Enable AURA LINE in Accessibility settings first, then return here.");
              });
              root.addView(preview);
              setContentView(root);
            }
          }
          EOF

          cat > app/src/main/java/dev/auraline/AuraService.java <<'EOF'
          package dev.auraline;

          import android.accessibilityservice.AccessibilityService;
          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.database.ContentObserver;
          import android.graphics.*;
          import android.media.AudioManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.*;
          import android.view.accessibility.AccessibilityEvent;

          public class AuraService extends AccessibilityService {
            public static AuraService current;
            private WindowManager wm;
            private LiquidLine line;
            private AudioManager audio;
            private Handler handler = new Handler(Looper.getMainLooper());
            private int lastMedia = -1, lastRing = -1;
            private final Runnable hide = () -> {
              if (line != null)
                line.animate().alpha(0).setDuration(380).start();
            };
            private ContentObserver observer;

            @Override protected void onServiceConnected() {
              super.onServiceConnected();
              current = this;
              audio = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
              wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
              line = new LiquidLine(this);
              line.setAlpha(0);

              int dp = (int) getResources().getDisplayMetrics().density;
              WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                42*dp, 240*dp,
                WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE |
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                PixelFormat.TRANSLUCENT
              );
              p.gravity = Gravity.RIGHT | Gravity.CENTER_VERTICAL;

              try {
                wm.addView(line,p);
              } catch (Exception e) {
                line = null;
              }

              lastMedia = audio.getStreamVolume(AudioManager.STREAM_MUSIC);
              lastRing = audio.getStreamVolume(AudioManager.STREAM_RING);

              observer = new ContentObserver(handler) {
                @Override public void onChange(boolean selfChange) {
                  checkChanged();
                }
              };
              getContentResolver().registerContentObserver(
                Settings.System.CONTENT_URI,true,observer
              );
            }

            @Override protected boolean onKeyEvent(KeyEvent event) {
              int key = event.getKeyCode();
              if (event.getAction() == KeyEvent.ACTION_DOWN &&
                  (key == KeyEvent.KEYCODE_VOLUME_UP ||
                   key == KeyEvent.KEYCODE_VOLUME_DOWN)) {
                int direction = key == KeyEvent.KEYCODE_VOLUME_UP ? 1 : -1;
                handler.postDelayed(() -> showCurrent(direction),110);
              }
              return false;
            }

            private void checkChanged() {
              if(audio == null) return;
              int m = audio.getStreamVolume(AudioManager.STREAM_MUSIC);
              int r = audio.getStreamVolume(AudioManager.STREAM_RING);
              if (m != lastMedia && lastMedia >= 0)
                show(m, audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC),
                  m > lastMedia ? 1 : -1);
              else if (r != lastRing && lastRing >= 0)
                show(r, audio.getStreamMaxVolume(AudioManager.STREAM_RING),
                  r > lastRing ? 1 : -1);
              lastMedia=m;
              lastRing=r;
            }

            private void showCurrent(int dir) {
              if(audio == null) return;
              show(
                audio.getStreamVolume(AudioManager.STREAM_MUSIC),
                audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC),dir
              );
            }

            private void show(int level,int max,int direction) {
              if(line == null) return;
              handler.removeCallbacks(hide);
              line.display((float)level / Math.max(1,max), direction);
              line.animate().cancel();
              line.animate().alpha(1f).setDuration(130).start();
              handler.postDelayed(hide,1000);
            }

            public void preview() { show(11,15,1); }
            @Override public void onAccessibilityEvent(AccessibilityEvent event) { }
            @Override public void onInterrupt() { }

            @Override public void onDestroy() {
              handler.removeCallbacksAndMessages(null);
              if(observer != null)
                getContentResolver().unregisterContentObserver(observer);
              if(wm != null && line != null) {
                try { wm.removeView(line); } catch(Exception ignored) {}
              }
              current=null;
              super.onDestroy();
            }

            static class LiquidLine extends View {
              private final Paint paint = new Paint(3);
              private float level = .5f, pulse = 0f;
              private int direction = 1;
              private ValueAnimator flow;

              LiquidLine(Context c) {
                super(c);
                setLayerType(View.LAYER_TYPE_SOFTWARE,null);
              }

              void display(float newLevel,int dir) {
                direction=dir;
                level=Math.max(0,Math.min(1,newLevel));
                if(flow!=null) flow.cancel();
                flow=ValueAnimator.ofFloat(0,1);
                flow.setDuration(440);
                flow.addUpdateListener(a -> {
                  pulse=(float)a.getAnimatedValue();
                  invalidate();
                });
                flow.start();
                invalidate();
              }

              @Override protected void onDraw(Canvas c) {
                super.onDraw(c);
                float d=getResources().getDisplayMetrics().density;
                float x=getWidth()-13*d;
                float top=12*d;
                float bottom=getHeight()-12*d;
                float w=7*d;
                float r=w/2;

                paint.clearShadowLayer();
                paint.setShader(null);
                paint.setColor(Color.argb(110,170,217,237));
                c.drawRoundRect(x-w/2,top,x+w/2,bottom,r,r,paint);

                paint.setColor(Color.argb(80,13,29,45));
                c.drawRoundRect(
                  x-2*d,top+2*d,x+2*d,bottom-2*d,2*d,2*d,paint
                );

                float y=bottom-(bottom-top)*level;
                paint.setShader(new LinearGradient(
                  x,y,x,bottom,0xFFB5FFFF,0xFF2EA9F5,
                  Shader.TileMode.CLAMP
                ));
                paint.setShadowLayer(10*d,0,0,0xAA45DDFF);
                c.drawRoundRect(x-w/2,y,x+w/2,bottom,r,r,paint);
                paint.setShader(null);
                paint.clearShadowLayer();

                float py=direction>0
                  ? bottom-(bottom-top)*pulse
                  : top+(bottom-top)*pulse;

                paint.setColor(0xFFE4FFFF);
                paint.setShadowLayer(11*d,0,0,0xFF58E5FF);
                c.drawCircle(x,py,3.2f*d,paint);
                paint.clearShadowLayer();

                paint.setColor(0x88FFFFFF);
                c.drawRoundRect(
                  x-1.7f*d,Math.max(y,top)+2*d,
                  x-.7f*d,bottom-3*d,d,d,paint
                );
              }
            }
          }
          EOF

      - name: Install Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-LINE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
